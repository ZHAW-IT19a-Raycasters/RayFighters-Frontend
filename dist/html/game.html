<div id="debug-container"><span id="debug-window"></span></div>

<div id="gameControls">

    <div id="fps-container" class="position-fixed p-3">
        FPS: <span id="fps-counter"></span>
    </div>

    <div id="ticker-container"></div>

    <div id="shootbutton">
        <img src="assets/ui/crosshair.png" alt="crosshair" />
    </div>

    <div id="socket-status" class="position-fixed"></div>

    <div id="toolbar" class="container position-fixed p-3">
        <div class="row text-center mx-0">

            <div class="col-4 p-0 pr-4">
                <div class="row justify-content-center m-0">
                    <h5 id="mapName" class="m-0">Desert</h5>
                </div>
                <div class="row justify-content-center m-0">
                    <span id="playerName">Playername</span>
                </div>
            </div>

            <div class="col-2 p-0">
                <div class="row justify-content-center m-0">
                    <h5 class="m-0">Deaths</h5>
                </div>
                <div class="row justify-content-center m-0">
                    <span id="deaths">0</span>
                </div>
            </div>

            <div class="col-2 p-0">
                <div class="row justify-content-center m-0">
                    <h5 class="m-0">Kills</h5>
                </div>
                <div class="row justify-content-center m-0">
                    <span id="kills">0</span>
                </div>
            </div>

            <div class="col-4 p-0">
                <div class="row justify-content-center m-0">
                    <h5 class="m-0">Time</h5>
                </div>
                <div class="row justify-content-center m-0">
                    <span id="timer" >--:--</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="scoreboard-container" class="hud-con container-fluid h-100 justify-content-start" hidden>
    <div class="row text-white p-2 mt-5">
        <h1>Scoreboard</h1>
    </div>
    <div class="row">
        <table>
            <thead>
                <tr>
                    <th scope="col">Rank</th>
                    <th scope="col">Playername</th>
                    <th scope="col">Kill #</th>
                    <th scope="col">Death #</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <div class="row text-white p-2 mt-3">
        <h4>You're on <span id="playerRanking"></span> place.</h4>
    </div>
</div>

<div id="respawn-container" class="hud-con container-fluid h-100 align-items-center" hidden>
    <div class="row text-white p-2">
        <h1>You have been killed</h1>
    </div>
    <div class="row text-white mt-5">
        <h4>Respawning...</h4>
    </div>
</div>

<canvas id="game-canvas"></canvas>
