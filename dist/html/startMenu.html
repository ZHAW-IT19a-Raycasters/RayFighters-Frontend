<div class="menuContainer container-fluid d-flex h-100 position-fixed">
    <div class="d-flex menuWrapper text-white">
        <form id="logInForm" class="p-5">
            <div class="form-row">
                <div class="form-group col-sm-8">
                    <label>
                        <h4 class="m-0">Player Name</h4>
                    </label>
                    <input type="text" class="form-control menu-item" name="inputPlayerName" />
                </div>
            </div>
            <div class="form-row justify-content-center">
                <div class="form-group m-4">
                    <button type="submit" class="btn grow menu-item txt-btn" id="startbtn">
                        Start Game
                    </button>
                </div>
            </div>
            <div class="form-row justify-content-between">
                <div id="aboutbtn" class="grow menu-item txt-btn">
                    <span>
                        <h6>About the Game</h6>
                    </span>
                </div>
                <div id="sharebtn" class="grow menu-item txt-btn">
                    <h6>
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor"
                            class="bi bi-share" viewBox="0 0 16 16">
                            <path
                                d="M13.5 1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.499 2.499 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5zm-8.5 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm11 5.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z" />
                        </svg>
                        Share with friends
                    </h6>
                </div>
            </div>
        </form>

        <div id="aboutTab" class="p-5" hidden>
            <div class="row justify-content-end">
                <div id="backbtn" class="m-0 px-2 grow menu-item txt-btn">
                    <h6 class="m-0">X go Back</h6>
                </div>
            </div>
            <div class="row text-center text-break">
                <p></p>
            </div>
        </div>
    </div>
</div>
